[package]
	name = "waypointd"
	version = "0.1.0"
	edition = "2024"
	description = "A modern, self-hosted bookmark server with keyword shortcuts and full-text search"
	license = "MIT"

	# `src/main.rs` is the default binary entry point for a package named
	# "waypointd" — no [[bin]] section needed.

[features]
	# Both are on by default: timestamps show in every build, and source
	# locations only take effect in debug builds (the code paths are gated
	# on `debug_assertions` too — see src/logging/).
	default = ["show_time_stamp", "show_source_location"]
	# See src/logging/mod.rs for what these two toggle.
	show_time_stamp = ["dep:chrono"]
	show_source_location = []

[dev-dependencies]
	# Integration tests: temp-dir databases and axum-router request
	# injection via `tower::ServiceExt::oneshot` (no port binding needed).
	tempfile = "3"
	tower = { version = "0.5", features = ["util"] }
	http-body-util = "0.1"
	# Property tests for the sharp parsers (cursor tokens, URLs, datetimes).
	proptest = "1"

[dependencies]
	# HTTP server
	axum = "0.8"
	# Per-request panic catch: a panicking handler returns a 500 to the
	# client instead of unwinding through the task and killing the worker.
	tower-http = { version = "0.6", features = ["catch-panic"] }
	tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "fs", "signal", "time", "sync"] }
	mime_guess = "2"

	# Structured logging: a hand-rolled logger (stderr or a single file,
	# pretty or JSON). Only pulled in when the `show_time_stamp` logging
	# feature is enabled.
	chrono = { version = "0.4", optional = true }

	# Embeds `frontend/` into the binary so every build (debug and release)
	# ships the SPA the same way.
	rust-embed = "8"

	# OpenAPI spec generation. The raw spec is served at /api/openapi.json
	# and an interactive Swagger UI shell at /api/docs (loaded from a CDN,
	# so no assets are embedded in the release binary).
	utoipa = { version = "5", features = ["macros"] }

	# Constant-time comparison for the optional API bearer token.
	subtle = "2"

	# Database (single file, no server process to run alongside waypointd)
	rusqlite = { version = "0.40", features = ["bundled"] }

	# Serialization
	serde = { version = "1", features = ["derive"] }
	serde_json = { version = "1", features = ["preserve_order"] }

	# Zero-copy static responses (used by the embedded-frontend handler to
	# avoid heap-copying `&'static [u8]` assets into a `Vec`).
	bytes = "1"

	# Errors
	anyhow = "1"

	# Netscape bookmark HTML import (browser exports)
	regex = "1"

	# Dead-link checker — probing bookmarked URLs, rustls-based, light
	# enough not to bloat the dependency tree.
	ureq = "3"

	# Platform cache directory for the fetched-media cache (Linux
	# `~/.cache`, macOS `~/Library/Caches`, Windows `%LOCALAPPDATA%`).
	dirs = "5"

	# Percent-decoding of static-asset request paths before they touch the
	# filesystem, so encoded `..` / backslash components can't escape the
	# static root (already in the tree via axum/hyper).
	percent-encoding = "2"

[profile.release]
	# Size-optimized release: -Oz instead of -O3, fat LTO across all crates,
	# single codegen unit, and stripped symbols. `panic = "unwind"` is kept
	# (instead of "abort") so tower-http's CatchPanicLayer can convert a
	# panicking request handler into a 500 response rather than taking down
	# the whole worker. The binary is a bit larger than it would be with
	# abort-on-panic, but a single panicking request never kills the server.
	rpath = true
	opt-level = "s"
	lto = true
	codegen-units = 1
	strip = true
	panic = "unwind"
