<!doctype html>
<html lang="en" class="dark">
	<head>
		<meta charset="UTF-8" />
		<link rel="icon" type="image/svg+xml" href="/favicon.ico" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />
		<title>Waypoint</title>
		<script>
			// Pre-paint theme resolution: avoid a flash of the wrong theme.
			// Dark is the default; ".light" is opt-in via localStorage.
			(function () {
				try {
					const stored = localStorage.getItem("waypointd-state");
					const theme = stored ? JSON.parse(stored)?.state?.theme : null;
					if (theme === "light") {
						document.documentElement.classList.remove("dark");
						document.documentElement.classList.add("light");
					}
				} catch {
					// keep default dark
				}
			})();
		</script>
	</head>
	<body>
		<div id="app"></div>
		<script type="module" src="/src/main.tsx"></script>
	</body>
</html>
